<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Resource Remix icon</title>
  <desc id="desc">Two circular redirect arrows around a web globe.</desc>
  <defs>
    <linearGradient id="globeFill" x1="34" y1="30" x2="94" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62e3c7"/>
      <stop offset="1" stop-color="#147d9f"/>
    </linearGradient>
    <linearGradient id="warmArrow" x1="23" y1="91" x2="107" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe36d"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="coolArrow" x1="105" y1="37" x2="21" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="1" stop-color="#7fd5ff"/>
    </linearGradient>
    <marker id="warmHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.2" markerHeight="2.2" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5-10 5z" fill="#ff7a59"/>
    </marker>
    <marker id="coolHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="2.2" markerHeight="2.2" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5-10 5z" fill="#7fd5ff"/>
    </marker>
  </defs>

  <rect width="128" height="128" rx="28" fill="#101820"/>

  <circle cx="64" cy="64" r="31" fill="url(#globeFill)"/>
  <circle cx="64" cy="64" r="31" fill="none" stroke="#f7fbff" stroke-width="5"/>
  <ellipse cx="64" cy="64" rx="13" ry="31" fill="none" stroke="#f7fbff" stroke-width="4"/>
  <path d="M36 54h56M36 74h56" fill="none" stroke="#f7fbff" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 33v62" fill="none" stroke="#f7fbff" stroke-width="4" stroke-linecap="round"/>

  <path d="M29 82c15 25 55 25 70 0" fill="none" stroke="url(#warmArrow)" stroke-width="10" stroke-linecap="round" marker-end="url(#warmHead)"/>

  <path d="M99 46c-15-25-55-25-70 0" fill="none" stroke="url(#coolArrow)" stroke-width="10" stroke-linecap="round" marker-end="url(#coolHead)"/>
</svg>
